{% extends 'base.html' %}

{% block title %}Connexion — Dashboard{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-box">
    <div style="display:flex;justify-content:center;margin-bottom:1.5rem;">
      <svg width="210" height="162" viewBox="-140 -80 280 215" xmlns="http://www.w3.org/2000/svg">
        <circle cx="0" cy="0" r="46" fill="none" stroke="#354626" stroke-width="1"/>
        <circle cx="0" cy="0" r="38" fill="#354626"/>
        <line x1="-46" y1="0" x2="-38" y2="0" stroke="#354626" stroke-width="2"/>
        <line x1="38" y1="0" x2="46" y2="0" stroke="#354626" stroke-width="2"/>
        <line x1="0" y1="-46" x2="0" y2="-38" stroke="#354626" stroke-width="2"/>
        <line x1="0" y1="38" x2="0" y2="46" stroke="#354626" stroke-width="2"/>
        <circle cx="-46" cy="0" r="2.5" fill="#DD7C0C"/>
        <circle cx="46" cy="0" r="2.5" fill="#DD7C0C"/>
        <circle cx="0" cy="-46" r="2.5" fill="#DD7C0C"/>
        <circle cx="0" cy="46" r="2.5" fill="#DD7C0C"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#DD7C0C" stroke-width="1.5"/>
        <text x="0" y="8" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">IA</text>
        <text x="0" y="76" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#354626" text-anchor="middle">Mon Agent IA</text>
        <line x1="-100" y1="90" x2="100" y2="90" stroke="#DD7C0C" stroke-width="1"/>
        <text x="0" y="108" font-family="Georgia, serif" font-size="11" fill="#697A4D" text-anchor="middle" letter-spacing="3">LA PETITE FABRIQUE DIGITALE</text>
      </svg>
    </div>
    <p class="login-subtitle">Chloé Ludmann</p>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="login-form">
      <div class="form-group">
        <label for="username">Identifiant</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <a href="{{ url_for('forgot_password') }}" class="login-secondary-link" style="display:block;text-align:right;margin-top:.4rem;">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn-primary" style="display:block;width:auto;margin:20px auto 0;">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
