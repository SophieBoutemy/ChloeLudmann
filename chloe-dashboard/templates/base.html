<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard — Chloé Ludmann{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if session.get('logged_in') and request.endpoint != 'login' %}
  <header>
    <div class="header-inner">

      <div class="header-brand">
        <svg class="header-compass" width="52" height="52" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="0" cy="0" r="46" fill="none" stroke="#2F4A3C" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="28" fill="#2F4A3C"/>
          <line x1="-46" y1="0" x2="-36" y2="0" stroke="#2F4A3C" stroke-width="2"/>
          <line x1="36" y1="0" x2="46" y2="0" stroke="#2F4A3C" stroke-width="2"/>
          <line x1="0" y1="-46" x2="0" y2="-36" stroke="#2F4A3C" stroke-width="2"/>
          <line x1="0" y1="36" x2="0" y2="46" stroke="#2F4A3C" stroke-width="2"/>
          <circle cx="-46" cy="0" r="3" fill="#D97A3D"/>
          <circle cx="46" cy="0" r="3" fill="#D97A3D"/>
          <circle cx="0" cy="-46" r="3" fill="#D97A3D"/>
          <circle cx="0" cy="46" r="3" fill="#D97A3D"/>
          <circle cx="0" cy="0" r="18" fill="none" stroke="#D97A3D" stroke-width="1.5"/>
          <text x="0" y="5" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">IA</text>
        </svg>
        <div class="header-brand-text">
          <span class="header-name">Mon Adjoint IA</span>
          <span class="header-tagline">par Sophie Boutemy</span>
        </div>
      </div>

      <nav class="header-nav">
        <a href="{{ url_for('index') }}"
           class="header-nav-link {% if request.endpoint == 'index' %}active{% endif %}">Tableau de bord</a>
        <a href="{{ url_for('eleves') }}"
           class="header-nav-link nav-desktop-only {% if request.endpoint in ('eleves', 'eleve_detail', 'eleves_export', 'eleve_relancer', 'eleve_update_property', 'eleve_save_notes') %}active{% endif %}">Base élèves</a>
        <a href="{{ url_for('factures') }}"
           class="header-nav-link nav-desktop-only {% if request.endpoint in ('factures', 'facture_detail', 'factures_export', 'factures_refresh', 'facture_update_comptable') %}active{% endif %}">Factures</a>
        <a href="{{ url_for('liste_attente') }}"
           class="header-nav-link nav-desktop-only {% if request.endpoint == 'liste_attente' %}active{% endif %}">Liste d'attente</a>
        <a href="{{ url_for('brief_to_post') }}"
           class="header-nav-link nav-desktop-only {% if request.endpoint in ('brief_to_post', 'brief_to_post_generate', 'brief_to_post_item') %}active{% endif %}">Brief to Post</a>
      </nav>

      <div class="header-right">
        <a href="{{ url_for('logout') }}" class="nav-logout"
           title="Déconnexion" aria-label="Déconnexion">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </a>
      </div>

    </div>
  </header>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
